name: Renovate

# Opens a PR when a dependency this repo pins has moved. What it scans and how
# it groups is in .github/renovate.jsonc.
#
# Runs under the org's App, so no third party holds write access. Every
# required check runs against the new dependency on the PR that brings it, so
# a red one is the upgrade rather than the branch.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-26.04-arm

    # No checkout: Renovate clones the repository itself and reads
    # .github/renovate.jsonc from that clone.
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Needs contents:write (push the update branch), pull-requests:write
        # (open the PR) and issues:write (the dependency dashboard is an issue)
        # on this repo. A PR opened with GITHUB_TOKEN would not trigger CI.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The action is SHA-pinned, but its default renovate-version is a
          # floating major tag — this names the container that actually runs.
          renovate-version: '44.115.10'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
