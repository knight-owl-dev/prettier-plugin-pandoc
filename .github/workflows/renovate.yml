name: Renovate

# Opens a PR when a dependency this repo pins has moved. What it scans and how
# it groups is in .github/renovate.jsonc.
#
# Runs under the org's App, so no third party holds write access. Every
# required check runs against the new dependency on the PR that brings it, so
# a red one is the upgrade rather than the branch.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-26.04-arm

    # No checkout: Renovate clones the repository itself and reads
    # .github/renovate.jsonc from that clone.
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Needs contents:write (push the update branch), pull-requests:write
        # (open the PR) and issues:write (the dependency dashboard is an issue)
        # on this repo. A PR opened with GITHUB_TOKEN would not trigger CI.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        # The image itself, by its manifest-list digest so the arm64 runner
        # resolves its platform: the org's supply-chain policy rules out
        # wrapper actions.
        uses: docker://ghcr.io/renovatebot/renovate:44.181.5@sha256:611eac05a6ee11c06d23157ae2ca11364f5b4a096c12d7f82a65aec2b6ec8a48
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
