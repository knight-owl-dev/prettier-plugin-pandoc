# Shortcuts as keystone's manual writes them, one body that misreads, and
# a span with a reference nothing defines.
pullquote:
  class: align
  content: font
  body: |
    ::: rule
    :::
    ::: font
    :::
    ::: rule
    :::
epigraph:
  class: font
  content: slot
  body: |
      ::: quote
      Opening words
      ::: slot
      :::
sic:
  class: container
  span: |
    []{.slot} [[sic]]{.font style="italic"}, as [the style guide][guide] has it
